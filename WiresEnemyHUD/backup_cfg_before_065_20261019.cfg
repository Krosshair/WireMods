[Enemy Health Bar]

## Choose enemy HP text: current HP, current/max HP, percentage, or None to hide the counter.
# Setting type: String
# Default value: Current HP
# Acceptable values: Current HP, Current HP/Max HP, Percentage, None
Health display = Current HP

## Doubles the thickness of enemy HP bars while keeping their width.
# Setting type: Boolean
# Default value: true
Double size = true

## Keep visible enemy nameplates within the screen edges. Nameplates above the screen track horizontally along the top edge.
# Setting type: Boolean
# Default value: true
Keep bars on screen = true

## Reveal an enemy health bar for 3 seconds after you successfully damage it. Each additional hit from you restarts the timer. Killing blows leave the current visibility unchanged.
# Setting type: Boolean
# Default value: true
Show on damage = true

## Show a brief white outline flash on an enemy HP bar when a backstab or stagger-critical lands.
# Setting type: Boolean
# Default value: true
Critical hit flash = true

## How an enemy shows that it noticed you. Pastel: soft name colors. Normal: stronger Valheim name colors. Icons: the vanilla awareness icons. None: no awareness display at all.
# Setting type: NameColorMode
# Default value: Pastel
# Acceptable values: Pastel, Normal, Icons, None
Awareness display = Pastel

## Display ordinary enemy names in uppercase letters.
# Setting type: Boolean
# Default value: false
Uppercase names = false

## Sides: weaknesses in color left of the health bar, resistances in gray right of it. StarRow: weaknesses only, in the star row. Off: none.
# Setting type: WeaknessDisplay
# Default value: Sides
# Acceptable values: Sides, StarRow, Off
Weakness display = Sides

Weakness icons = true

Weakness ring = true

Weakness hit flash = true

Low-health priority threshold (%) = 20

[General]

## Select Author's Choice to apply my preferred Enemy HUD settings, or Vanilla to restore a vanilla-style HUD starting point. Selecting either preset applies its values to the options below.
# Setting type: String
# Default value: Author\'s Choice
# Acceptable values: Author's Choice, Vanilla
Preset = Author\'s Choice

[Multiplayer]

## Synchronize enemy stagger-meter progress between players through Valheim network data.
# Setting type: Boolean
# Default value: true
SyncStaggerPercentage = true

## Minimum number of seconds between multiplayer stagger updates per enemy. Lower values update more frequently.
# Setting type: Single
# Default value: 0.1
SyncIntervalSeconds = 0.1

## Minimum change in stagger-meter progress (0 to 1) before sending another multiplayer update. Smaller values capture finer changes.
# Setting type: Single
# Default value: 0.01
SyncMinimumDelta = 0.01

[Player Health Bar]

## Choose the text above other players: current HP, current/max HP, percentage, or None to hide the counter.
# Setting type: String
# Default value: Current HP/Max HP
# Acceptable values: Current HP, Current HP/Max HP, Percentage, None
Health display = Current HP/Max HP

## Doubles the thickness of multiplayer player HP bars while keeping their width.
# Setting type: Boolean
# Default value: true
Double size = true

## Fade other player nameplates to 25% opacity until your crosshair aims directly at that player; the targeted player stays fully visible.
# Setting type: Boolean
# Default value: true
Fade unfocused player nameplates = true

[Stagger Bar]

## Show a stagger meter beneath enemy HP bars. The meter fills as enemies take stagger damage.
# Setting type: Boolean
# Default value: true
Enabled = true

## Adjust the vertical gap between enemy HP and stagger bars. Higher values move stagger bars lower.
# Setting type: Single
# Default value: 8
VerticalOffset = 8

## Adjust how far star icons move down when the stagger bar appears. Higher values add more space.
# Setting type: Single
# Default value: 8
StarVerticalOffset = 8

## Automatically hide the stagger meter on enemies with no stagger threshold.
# Setting type: Boolean
# Default value: true
HideForNonStaggerableEnemies = true

## Show a yellow layer inside the enemy stagger bar during a stagger. It recedes from right to left over the enemy's actual stagger time (the window in which your hits deal double damage), revealing the orange bar beneath.
# Setting type: Boolean
# Default value: true
Recovery overlay = true

[Status Effects]

Enabled = true


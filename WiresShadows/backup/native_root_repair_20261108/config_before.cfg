## Settings file was created by plugin Wire's Pointlight Rework v0.1.0
## Plugin GUID: wire.valheim.lightocclusion

[Debug]

## Use four neighbouring map texels instead of four diagonal point samples.
# Setting type: Boolean
# Default value: true
Static shadow texel-aligned PCF = true

## Diagnostic only: use twice the width and height for moving shadow maps (4x texture memory/pixel cost). If distant moving-shadow blockiness remains identical, resolution is not the root cause. Disabled by default.
# Setting type: Boolean
# Default value: false
Double moving shadow map resolution = false

## Diagnostic: match Unity's four cube-offset soft-shadow samples, each with bilinear comparison (16 RGHalf lookups instead of 4). Same map resolution, exact Unity 1/128 direction offsets. Can cost significantly more GPU time; toggle live to compare. Disabled by default.
# Setting type: Boolean
# Default value: false
Native soft moving shadow comparison = false

## Shows only the cached-shadow light nearest the middle of the screen, as the shadow test sees it: green = lit, red = shaded by the cached map, blue = shaded by the moving map (brighter = the blocker is further in front, full at 10 cm). Logs that light's details.
# Setting type: Boolean
# Default value: false
Debug view = false

## ALL sconces cast real-time Unity soft shadows rather than WLO cached shadows, even if vanilla disabled their shadows. Turn off to restore WLO for all sconces.
# Setting type: Boolean
# Default value: false
Compare with game shadows = false

## Writes a [check] line to the log each time one of these happens: a moving light gets shadows, a distant light moves up for moving things, a map re-renders in the background and swaps in, a light without LightLod switches on, objects with untagged shaders are drawn directly, and what an item on a stand is made of.
# Setting type: Boolean
# Default value: false
Debug log = false

## Turn on and keep playing: measures average frame time with the mod, with only its shader, and with the game's own lighting, three rounds of 5 s each, shown on screen and written to the log. Turns itself off.
# Setting type: Boolean
# Default value: false
Benchmark = false

## Experimental shadow pipeline bisection: captures 10 labelled comparison screenshots of one fixed scene and logs per-stage frame times. Run in-game while standing still. Restores normal shadow sampling automatically. Disabled by default.
# Setting type: Boolean
# Default value: false
Automatic shadow diagnosis = false

## DIAGNOSTIC ONLY: redraw the ENTIRE cubemap face for moving casters instead of only their predicted screen rectangle. Keeps resolution, casters, depth shader, and PCF identical. May cost significantly more GPU time. Resets moving face caches on change.
# Setting type: Boolean
# Default value: false
Disable moving shadow scissor = false

## Which light slot to capture (-1 selects the two closest active moving-shadow lights). Look up slots in the written metadata file.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 95
Raw moving map slot = -1

## One-shot GPU readback of raw R/G moving cubemap depth faces, before any PCF/shader filtering. Writes lossless 32-bit floating-point channels and preview PNGs to WLO_RawMaps. May briefly hitch. Automatically resets to false.
# Setting type: Boolean
# Default value: false
Dump raw moving shadow maps = false

[General]

## Use this mod's copy of Valheim's lighting shader. Off puts the game's own back (and turns the cached shadows off).
# Setting type: Boolean
# Default value: true
Use rebuilt lighting shader = true

## Master switch for Wire's Light Occlusion. Off restores vanilla lighting and disables WLO shadows.
# Setting type: Boolean
# Default value: true
Enabled = true

## Vanilla: Valheim's stepped toon shading. SmoothPointLights: torches, fires and other point lights shade smoothly, sun and moon keep their bands. SmoothAll: all lighting shades smoothly. Needs the rebuilt lighting shader.
# Setting type: LightBands
# Default value: Vanilla
# Acceptable values: Vanilla, SmoothPointLights, SmoothAll
Light bands = Vanilla

## Shadow edges move with a flickering flame, as in vanilla: further from what casts them, more; where things touch, not at all. Off: shadows hold still at the flame's resting spot.
# Setting type: Boolean
# Default value: true
Shadows follow the flame = true

## The piece you're about to place casts shadows from the sun, moon and lights (vanilla turns them off).
# Setting type: Boolean
# Default value: true
Building preview casts shadows = true

## Pointlight Rework: cached shadows are drawn like the game's own point-light shadows (each object's own shadow pass: bent banners, cutouts, exactly what casts). Off: the previous replacement-shader method. Re-caches all lights when changed.
# Setting type: Boolean
# Default value: true
Vanilla shadow drawing = false
## Banners and hanging cloth cast shadows that sway with them, drawn with the game's own cloth shader. Takes effect after a restart.
# Setting type: Boolean
# Default value: true
Banner and cloth shadows = true

## Lights that move every frame (a torch in someone's hand, a glowing item while it rolls, the building preview's light) get the game's own per-frame shadows, like a vanilla shadowed light. Costs about as much as one per light.
# Setting type: Boolean
# Default value: true
Moving lights cast shadows = true

## The nearest point lights get real shadows, rendered once and kept, instead of every frame. Includes lights that have no shadows in vanilla.
# Setting type: Boolean
# Default value: true
Cached shadows = true

## Players, creatures, swinging doors and the building preview cast shadows from cached-shadow lights too. Redrawn every frame, only for lights they're near.
# Setting type: Boolean
# Default value: true
Moving things cast shadows = true

## Every 10 seconds, report average frame time/FPS, WLO CPU hotspots, GPU work proxies, location, biome, Base pin, and the cost of logging itself. Also records [check] events.
# Setting type: Boolean
# Default value: true
Debug log = true

## DIAGNOSTIC ONLY: every ~20s sample main-camera frustum meshes, prefabs, shaders, lights and particles. Geometry is a GPU workload PROXY, not milliseconds; scene scans can briefly hitch. Disable for normal play or FPS comparisons.
# Setting type: Boolean
# Default value: true
Scene render diagnosis = true

## DIAGNOSTIC ONLY. Instruments existing game and mod managed methods to identify CPU hotspots; can reduce FPS due to Harmony overhead. Requires a game restart to enable/disable. Logs ranked CPU method timings every 10 seconds when Debug log is on. It cannot attribute native GPU/driver costs or isolate individual Harmony patch owners.
# Setting type: Boolean
# Default value: false
Deep CPU profiler = false

## Run the four-mode WLO versus vanilla benchmark. Measures 2 rounds and turns itself off.
# Setting type: Boolean
# Default value: false
Benchmark = false

[Quality]

## How many of the nearest point lights get cached shadows.
# Setting type: Int32
# Default value: 24
# Acceptable value range: From 1 to 32
Lights with shadows = 24

## Size of each shadow map face (moving shadows use the same), when not following the game's shadow quality. Vanilla point lights go up to 1024.
# Setting type: Int32
# Default value: 1024
# Acceptable value range: From 64 to 1024
Shadow resolution = 1024

## Shadow map sizes follow the game's shadow quality, like vanilla point lights: 1024 for lights near you (512 at Low), a quarter for distant ones. Off uses the resolution settings below.
# Setting type: Boolean
# Default value: true
Follow game shadow quality = true

## Extra lights beyond the full-size ones get smaller shadow maps, so they don't leak light either.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 0 to 64
Distant lights with shadows = 40

## Size of each distant light's shadow map face.
# Setting type: Int32
# Default value: 256
# Acceptable value range: From 64 to 1024
Distant shadow resolution = 256

## Lights further than this (minus half their range) don't get cached shadows.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 5 to 200
Shadow distance = 60

## Draw players and creatures straight into their shadow maps instead of through a hidden camera: much less CPU. If moving shadows ever look wrong (mirrored or rotated), turn this off.
# Setting type: Boolean
# Default value: true
Draw moving shadows directly = true

## Uses hardware comparison-depth cubemaps for EVERY cached point light, near and far. Static casters stay cached. Moving objects retain their optimized moving-map method. Uses extra GPU memory; OFF restores prior static filtering.
# Setting type: Boolean
# Default value: true
Native comparison for all cached lights = false
## Hardware depth comparisons for the existing WLO moving-caster maps. Only refreshed faces are converted on the GPU. Uses additional GPU memory. OFF restores the optimized original moving filter.
# Setting type: Boolean
# Default value: true
Native comparison for moving shadows = true



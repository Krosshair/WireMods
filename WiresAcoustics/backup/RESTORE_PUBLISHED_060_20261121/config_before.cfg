## Settings file was created by plugin Wire's Acoustics v0.6.0
## Plugin GUID: wire.valheim.acoustics

[Debug]

## Logs the measured space every few seconds and each muffled sound.
# Setting type: Boolean
# Default value: false
Debug log = false

## Every 5 seconds log main-thread timing, worst spikes, source processing and sampled audio DSP times. Does not enable verbose per-sound debug messages.
# Setting type: Boolean
# Default value: false
Profiler logging = true

Measure the reverb = false

Compare with the mod off = false

Fix sound clicks = false

Physical reverb = false

Skip the game mixer colouring = true

Measure reverb loudness = false

[General]

## Master switch. Off: the game's own reverb and no muffling.
# Setting type: Boolean
# Default value: true
Enabled = true

## Reverb from the space you're in: rays measure how enclosed it is, how big and what it's made of (stone rings, wood is warmer, soil and open sky swallow sound). Replaces the game's own reverb everywhere; out in the open it goes dry.
# Setting type: Boolean
# Default value: true
Room reverb = true

## Sounds get quieter with distance the way real sound does (6 dB each time the distance doubles, from the distance the game plays them at full volume), instead of the game's own curves, which cut many sounds off within a few metres (a hearth is silent 10 m away). The air still dulls them on top.
# Setting type: Boolean
# Default value: true
Realistic distance = true

## Sounds behind walls, buildings or hills are muffled and quieter, more so through several layers.
# Setting type: Boolean
# Default value: true
Muffling = true

## Where a sound is around your head: a tiny delay and muffling for the far ear, duller sounds from behind, and the outer ear's cue for above and below, instead of plain left/right panning. Made for headphones; turn off on speakers. On surround (5.1, 7.1) output the game's own panning is used.
# Setting type: Boolean
# Default value: true
HRTF (headphones) = true

## Sound takes time to reach you (350 m/s from your character's head): a sound far away starts as late as its distance makes it, up to half a second.
# Setting type: Boolean
# Default value: true
Travel time = true

## Sounds coming toward you are higher, going away lower. Needs Realistic distance (off: the game's own).
# Setting type: Boolean
# Default value: true
Doppler = true

## With your head under water everything is muffled, and sounds under water are muffled when you're above it.
# Setting type: Boolean
# Default value: true
Under water = true

## The further a sound travels, the more of its highs the air takes away (by the weather).
# Setting type: Boolean
# Default value: true
Air = true

## Wind carries sound: downwind of a sound it reaches further, upwind less.
# Setting type: Boolean
# Default value: true
Wind = true

## Sounds come from where they're made: a weapon's hand, a door's hinge, a chest's lid, the part of a station you used, a bird up in the open air, your own unplaced sounds at you. Off: where the game plays them.
# Setting type: Boolean
# Default value: true
Sound placement = true

## Proximity voice chat (if installed) is placed, muffled by walls and dulled by distance like any sound.
# Setting type: Boolean
# Default value: true
Voice chat = true

## Independent continuous world sounds (fires, sconces, machines) start at random positions within their loops instead of all playing in sync. Music, ambience and UI are unaffected.
# Setting type: Boolean
# Default value: true
Random loop start = true

Biome ambience = true

[Tuning]

## How loud the room's reverb is (1 = as designed, 0 = none).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Reverb strength = 1

## How strong the direction cues are: the far ear's dulling and level drop, the shading from behind, the delay between the ears (1 = as modelled, 2 = exaggerated).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
HRTF strength = 1

## How much walls muffle and quieten sounds (1 = as designed, 0 = none).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1,5
Muffling strength = 1

Experimental footstep declick = true


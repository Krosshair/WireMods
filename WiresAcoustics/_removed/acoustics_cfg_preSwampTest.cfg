## Settings file was created by plugin Wire's Acoustics v0.1.0
## Plugin GUID: wire.valheim.acoustics

[Debug]

## Logs the measured space every few seconds and each muffled sound.
# Setting type: Boolean
# Default value: false
Debug log = false

[General]

## Master switch. Off: the game's own reverb and no muffling.
# Setting type: Boolean
# Default value: true
Enabled = true

## Reverb from the space you're in: rays measure how enclosed it is, how big and what it's made of (stone rings, wood is warmer, soil and open sky swallow sound). Replaces the game's distance-only reverb indoors; outdoors it blends back to the game's own.
# Setting type: Boolean
# Default value: true
Room reverb = true

## Sounds behind walls, buildings or hills are muffled and quieter, more so through several layers.
# Setting type: Boolean
# Default value: true
Muffling = true

## Where a sound is around your head: a tiny delay and muffling for the far ear, duller sounds from behind, and the outer ear's cue for above and below, instead of plain left/right panning. Made for headphones; turn off on speakers.
# Setting type: Boolean
# Default value: true
HRTF (headphones) = true

[Tuning]

## How loud the room's reverb is (1 = as measured).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Reverb strength = 1

## How much walls muffle and quieten sounds (1 = as designed, 0 = none).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1,5
Muffling strength = 1

